apiVersion: batch/v1
kind: CronJob
metadata:
    name: pi-calculation-cron
spec:
    schedule: "*/5 * * * *"  # Runs every 5 minutes
    jobTemplate:
        spec:
            template:
                spec:
                    containers:
                    - name: pi
                      image: ubuntu
                      command: ["bash", "-c", "echo 'scale=1000; 4*a(1)' | bc -l"]
                    restartPolicy: Never